name: Pashalan Google-Compliant Daily Editorial Engine (E-E-A-T)

on:
  schedule:
    # Runs automatically twice daily (09:00 and 21:00 Iran time) — safe human publishing cadence
    - cron: '30 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-eeat-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Google-Compliant Editorial Publisher & Sitemap Sync
        run: node scripts/auto-editorial-publisher.mjs

      - name: Commit & Push Updated Feed and Sitemap
        run: |
          git config user.name "Pashalan Editorial Board"
          git config user.email "editorial@pashalan.ir"
          if [[ -n $(git status --porcelain public/data/auto-editorial-feed.json public/sitemap.xml) ]]; then
            git add public/data/auto-editorial-feed.json public/sitemap.xml
            git commit -m "content(eeat): publish scheduled human-reviewed article, Did-You-Know & sitemap update"
            git push origin HEAD:main
          else
            echo "No new editorial changes to commit."
          fi
